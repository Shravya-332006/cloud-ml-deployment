<form action="/predict" method="post" class="ml-input-form">
    <div class="input-group">
        <label for="sepal_length">Sepal Length (cm)</label>
        <input type="number" step="0.1" name="sepal_length" id="sepal_length" required value="{{ inputs.sepal_length }}">
    </div>
    <div class="input-group">
        <label for="sepal_width">Sepal Width (cm)</label>
        <input type="number" step="0.1" name="sepal_width" id="sepal_width" required value="{{ inputs.sepal_width }}">
    </div>
    <div class="input-group">
        <label for="petal_length">Petal Length (cm)</label>
        <input type="number" step="0.1" name="petal_length" id="petal_length" required value="{{ inputs.petal_length }}">
    </div>
    <div class="input-group">
        <label for="petal_width">Petal Width (cm)</label>
        <input type="number" step="0.1" name="petal_width" id="petal_width" required value="{{ inputs.petal_width }}">
    </div>
    <button type="submit" class="btn-predict">Get Inference</button>
</form>

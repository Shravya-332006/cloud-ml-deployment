<!-- Right Side: Real-Time Prediction Results -->
<section class="results-panel">
    <div class="card result-card">
        <div class="status-badge live">Live Service</div>
        <h2>Prediction Result</h2>
        
        {% if prediction_text %}
            <div class="prediction-output success">
                <span class="prefix">CLASSIFIED SPECIES:</span>
                <p class="species-name">{{ species | upper }}</p>
                {% if image_url %}
                    <div class="image-container">
                        <img src="{{ image_url }}" alt="{{ species }}" class="flower-image">
                    </div>
                {% endif %}
            </div>
        {% else %}
            <div class="prediction-output pending">
                <p>Submit features to run the ML model.</p>
            </div>
        {% endif %}
    </div>
</section>

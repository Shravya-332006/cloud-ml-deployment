<!DOCTYPE html>
<html>
<body style="font-family: Arial; margin: 40px;">
    <h2>GCP ML Model Predictor</h2>
    <form action="/predict" method="post">
        <p>Sepal Length: <input type="number" step="0.1" name="sepal_length" value="5.1"></p>
        <p>Sepal Width: <input type="number" step="0.1" name="sepal_width" value="3.5"></p>
        <p>Petal Length: <input type="number" step="0.1" name="petal_length" value="1.4"></p>
        <p>Petal Width: <input type="number" step="0.1" name="petal_width" value="0.2"></p>
        <button type="submit">Predict</button>
    </form>
    <h3>{{ prediction_text }}</h3>
</body>
</html>
